<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>repo-audit 文档阅读器</title>
  <style>
    :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --accent-hover: #79c0ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    .top-bar { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; flex-wrap: wrap; padding: 0.75rem 1.25rem; background: rgba(13,17,23,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .top-bar .home { color: var(--text); font-weight: 700; text-decoration: none; }
    .top-bar .home:hover { color: var(--accent); }
    .top-bar .doc-title { color: var(--muted); font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-bar .actions { display: flex; gap: 0.75rem; }
    .top-bar a.action { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .top-bar a.action:hover { color: var(--accent-hover); text-decoration: underline; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .status { color: var(--muted); text-align: center; padding: 3rem 0; }
    .status.error { color: #f85149; }
    /* Markdown 内容区（GitHub 暗色风格近似） */
    .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 0.6em; }
    .md h1 { font-size: 1.9rem; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    .md h2 { font-size: 1.5rem; padding-bottom: 0.3em; border-bottom: 1px solid var(--border); }
    .md h3 { font-size: 1.2rem; }
    .md h4 { font-size: 1rem; }
    .md p, .md ul, .md ol { margin: 0.8em 0; }
    .md ul, .md ol { padding-left: 1.6em; }
    .md li { margin: 0.3em 0; }
    .md a { color: var(--accent); }
    .md a:hover { color: var(--accent-hover); }
    .md code { font-family: 'SF Mono', Monaco, Inconsolata, monospace; background: #21262d; padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.85em; }
    .md pre { background: #161b22; border: 1px solid var(--border); border-radius: 6px; padding: 1rem; overflow-x: auto; margin: 1em 0; }
    .md pre code { background: none; padding: 0; font-size: 0.85rem; }
    .md blockquote { border-left: 3px solid var(--border); padding-left: 1em; color: var(--muted); margin: 1em 0; }
    .md table { border-collapse: collapse; margin: 1em 0; width: 100%; }
    .md th, .md td { border: 1px solid var(--border); padding: 0.5em 0.8em; text-align: left; }
    .md th { background: var(--card); }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    .md img { max-width: 100%; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="home" href="./">← repo-audit 文档</a>
    <span class="doc-title" id="doc-title">加载中…</span>
    <div class="actions">
      <a class="action" id="raw-link" href="#" target="_blank" rel="noopener">查看原始 Markdown</a>
    </div>
  </div>
  <div class="wrap">
    <div class="status" id="status">加载中…</div>
    <article class="md" id="content" hidden></article>
  </div>

  <!-- marked.js（CDN，SRI 固定版本；失败时降级显示原始文本） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"
          integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi"
          crossorigin="anonymous"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search)
    var doc = params.get('doc') || ''
    var titleEl = document.getElementById('doc-title')
    var statusEl = document.getElementById('status')
    var contentEl = document.getElementById('content')
    var rawEl = document.getElementById('raw-link')

    // 白名单：只允许站点内已知文档，防任意 URL 注入
    var DOCS = {
      'AGENT-INDEX.json':      { title: '🤖 AGENT-INDEX.json — 机器可读文档索引', raw: true },
      'SCHEMA.json':           { title: '📐 SCHEMA.json — 报告 JSON Schema', raw: true },
      'AGENT-PROTOCOL.md':     { title: '📖 AGENT-PROTOCOL.md — Agent 操作协议' },
      'repo-audit/HUMAN-GUIDE.md': { title: '📖 HUMAN-GUIDE.md — 人类使用手册' },
      'repo-audit/AGENT-GUIDE.md': { title: '🤖 AGENT-GUIDE.md — Agent 操作手册' },
      'AUDIT.md':              { title: '🔍 AUDIT.md — 审计方法论' },
      'BEST-PRACTICES.md':     { title: '📏 BEST-PRACTICES.md — 最佳实践标准' },
      'REPO-CLASSIFICATION.md':{ title: '🏷️ REPO-CLASSIFICATION.md — 分类检测' },
      'templates/README.md':   { title: '🚀 templates/README.md — 脚手架生成' }
    }

    var entry = DOCS[doc]
    if (!entry) {
      titleEl.textContent = '未找到文档'
      statusEl.className = 'status error'
      statusEl.textContent = '未找到文档：' + (doc || '（未指定 doc 参数）') + '。请从首页选择文档入口。'
      rawEl.style.display = 'none'
      return
    }
    titleEl.textContent = entry.title
    document.title = entry.title + ' · repo-audit'
    rawEl.href = doc

    if (entry.raw) {
      // JSON 文档不套 Markdown 渲染，直接跳原始文件
      location.replace(doc)
      return
    }

    if (!window.marked) {
      // CDN 失败降级：等宽原始文本
      contentEl.hidden = false
      contentEl.style.fontFamily = "'SF Mono', Monaco, monospace"
      statusEl.hidden = true
      fetch(doc).then(function (r) { return r.text() }).then(function (t) {
        contentEl.textContent = t
        titleEl.textContent += '（渲染库加载失败，显示原始文本）'
      })
      return
    }

    fetch(doc)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status)
        return r.text()
      })
      .then(function (text) {
        marked.setOptions({ gfm: true, breaks: false })
        contentEl.innerHTML = marked.parse(text)
        statusEl.hidden = true
        contentEl.hidden = false
        // 锚点跳转修正：相对链接指向站内其他文档时走阅读器
        contentEl.querySelectorAll('a[href]').forEach(function (a) {
          var href = a.getAttribute('href') || ''
          if (/^https?:/.test(href) || href.charAt(0) === '#') return
          if (href.endsWith('.md')) {
            var name = href.split('/').pop()
            var mapped = null
            for (var k in DOCS) { if (k.split('/').pop() === name) { mapped = k; break } }
            if (mapped) a.href = 'viewer.html?doc=' + encodeURIComponent(mapped)
          }
        })
      })
      .catch(function (e) {
        statusEl.className = 'status error'
        statusEl.textContent = '文档加载失败（' + e.message + '）。可直接查看原始 Markdown。'
      })
  })()
  </script>
</body>
</html>
