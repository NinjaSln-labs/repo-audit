# <name>（Python）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "<name>"
version = "0.1.0"
description = "<一句话描述>"
license = { text = "MIT" }
authors = [{ name = "<org>" }]
requires-python = ">=3.11"
dependencies = [
  # 运行时依赖按契约预检结果填
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/<org>/<repo>#readme"
Repository = "https://github.com/<org>/<repo>.git"
Issues = "https://github.com/<org>/<repo>/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/<name>"]   # src 布局：包目录 src/<name>/（自建，含 __init__.py）

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
