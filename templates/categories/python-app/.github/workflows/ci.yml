# Python CI（push/PR 验证）
#
# 验证链单源：scripts/verify.py（ruff → pytest 探测式）——本地与 CI 同一入口。
# 首推前置：无 lockfile 时首次安装生成 requirements 锁（如 pip-compile）再入库，可选。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@<commit-SHA> # actions/checkout@v7.0.1
      - name: Setup Python
        uses: actions/setup-python@<commit-SHA> # actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify
        run: python scripts/verify.py
