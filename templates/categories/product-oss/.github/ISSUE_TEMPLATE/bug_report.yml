name: Bug report（缺陷报告）
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 issue 避免重复。
        安全漏洞**不要**在此报告——请使用 Security 标签页的
        "Report a vulnerability"（私密报告）。
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 一步一步描述如何触发问题；附最小复现代码更好
      placeholder: |
        1. 运行 '...'
        2. 看到 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "例如 v1.2.3 或 commit sha"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 运行环境
      options:
        - Linux
        - macOS
        - Windows
        - 其他（请在补充说明中注明）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图
      description: 拖拽文件或直接粘贴
      render: shell
    validations:
      required: false
