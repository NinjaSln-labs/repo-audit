rules:
  - id: SEC-001
    title: "无硬编码密钥"
    severity: critical
    domain: security
    applies_to: ["*"]
    check: grep
    params:
      patterns:
        - "(?i)(api[_-]?key|secret|password|token)\\s*[:=]\\s*['\"][^'\"]{8,}"
      exclude:
        - ".git/"
        - "node_modules/"
        - ".scaffold/"
        - "audit-report/"
        - "templates/"
      max_match: 0
    description: "源代码中不应包含硬编码密钥或凭证（AGENTS-core 机密红线第 3 条）"
    fix_hint: "使用环境变量或密钥管理服务"

  - id: SEC-002
    title: "Workflow 使用 SHA 固定"
    severity: major
    domain: security
    applies_to: ["dsh-plugin", "python-app", "go-service", "javascript", "npm-package"]
    check: grep
    params:
      patterns:
        - "@[a-f0-9]{40}"
      exclude:
        - ".git/"
        - "node_modules/"
        - ".scaffold/"
        - "audit-report/"
        - "templates/"
      max_match: 1
    description: "GitHub Actions workflow 应使用 SHA 固定而非 tag（BEST-PRACTICES §6.1）"
    fix_hint: "将 actions/checkout@v4 改为 actions/checkout@<SHA>"
    note: "无 workflow 文件的仓库豁免"

  - id: SEC-003
    title: "无本机绝对路径"
    severity: minor
    domain: security
    applies_to: ["*"]
    check: grep
    params:
      patterns:
        - "/home/[a-z]"
        - "/Users/[a-z]"
        - "/mnt/[a-z]"
      exclude:
        - ".git/"
        - "node_modules/"
        - ".scaffold/"
        - "audit-report/"
        - "templates/"
        - "CHANGELOG.md"
        - "HANDOFF.md"
        - "HANDOFF-ARCHIVE/"
        - ".agents/"
      max_match: 0
    description: "源代码不应包含本机绝对路径（AGENTS-core 机密红线第 3 条）；CHANGELOG/HANDOFF 等交接文档豁免"
    note: "severity=minor：描述性路径文本（如 CHANGELOG 中的扫描描述）容忍；硬编码密钥仍由 SEC-001 覆盖"

  - id: SEC-004
    title: "publish workflow 含 id-token write"
    severity: critical
    domain: security
    applies_to: ["dsh-plugin", "python-app"]
    check: yaml_field
    params:
      path: ".github/workflows/publish.yml"
      field: "permissions.id-token"
      fallback_field: ["jobs.*.permissions.id-token"]
      expected: "write"
      skip_if_no_file: ".github/workflows/publish.yml"
    description: "publish workflow 必须请求 id-token: write 权限（OIDC Trusted Publishing）——工作流顶层或 publish job 级任一即可（job 级为 PyPA 推荐的最小化模式）"
    template_ref: "templates/repo-root/.github/workflows/publish.yml"
    fix_hint: "在 publish workflow 声明 permissions.id-token: write——顶层（permissions: 块内）或仅 publish job（jobs.publish.permissions: 块内）均可；推荐 job 级（最小化，其他 job 不持有 OIDC 权限）"
