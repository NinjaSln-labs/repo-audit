name: Bug Report
description: 报告工具 bug
labels: ["bug", "audit-feedback"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug 描述
      description: 简要描述遇到的问题
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何复现此问题
      placeholder: |
        1. 运行...
        2. 看到...
        3. 期望看到...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      description: 工具的实际输出
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望输出
      description: 期望的工具输出
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 运行环境和配置
      placeholder: |
        - 工具版本: 1.2.0
        - Node.js: v24.18.0
        - 平台: linux x64
        - 目标仓库: <repo path>
        - 目标仓库分类: <type>

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - critical - 工具无法运行
        - major - 功能严重受损
        - minor - 功能部分受损
        - info - 建议改进
    validations:
      required: false
