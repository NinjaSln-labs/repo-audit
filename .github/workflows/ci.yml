# repo-audit CI 工作流（push/PR 验证）
#
# 与 publish.yml 的分工：
# - 本 workflow：push 到 master / PR 时跑验证链
# - 验证链与发布完全同源：verify.mjs 单源入口
# - 无发布语义：不需要 id-token，权限只要 contents: read
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit (self)
        run: node repo-audit.mjs --repo . --format json --output ./audit-report
      - name: Verify chain
        run: node verify.mjs
      - name: Test
        run: node --test
