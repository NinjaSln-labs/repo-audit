# repo-audit 发布工作流（OIDC Trusted Publishing）
#
# 安全模型：
# - 触发 = 本机人工创建的 tag（vX.Y.Z），发布决策永远是人的决定
# - 认证：npm Trusted Publishing（OIDC）——免长期 token、自动 provenance
# - 权限最小化：contents: read + id-token: write（OIDC 签发所需）
# - 版本一致性守卫：tag 版本必须与 package.json version 完全一致
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 'Guard: tag version matches package.json'
        run: |
          EXPECTED="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::tag/version mismatch: $GITHUB_REF vs $EXPECTED"
            exit 1
          fi
      - name: Audit (self)
        run: node repo-audit.mjs --repo . --format json --output ./audit-report
      - name: Verify chain
        run: node verify.mjs
      - name: Test
        run: node --test
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          echo "npm version: $(npm --version)"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease $VERSION → dist-tag next"
            npm publish --access public --tag next --provenance --loglevel verbose
          else
            echo "stable $VERSION → dist-tag latest"
            npm publish --access public --provenance --loglevel verbose
          fi
