# repo-audit 发布工作流（OIDC Trusted Publishing）
#
# 安全模型：
# - 触发 = 本机人工创建的 tag（vX.Y.Z），发布决策永远是人的决定
# - 认证：npm Trusted Publishing（OIDC）——免长期 token、自动 provenance
# - 权限最小化：contents: read + id-token: write（OIDC 签发所需）
# - 版本一致性守卫：tag 版本必须与 package.json version 完全一致
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm>=11.5.1 支持 OIDC Trusted Publishing；npm@12 要求 node ^22.22.2
          # runner 用 node 22 的 setup-node 自带 npm≥11.5.1，可省去全局升级 npm
      - name: 'Guard: tag version matches package.json'
        run: |
          EXPECTED="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$EXPECTED" ]; then
            echo "::error::tag/version mismatch: $GITHUB_REF vs $EXPECTED"
            exit 1
          fi
      - name: Audit (self)
        run: node repo-audit.mjs --repo . --format json --output ./audit-report
      - name: Verify chain
        run: node verify.mjs
      - name: Test
        run: node --test
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # OIDC Trusted Publishing 要求 npm>=11.5.1（node 22 runner 自带满足；
          # 仅当自带版本过旧时兜底升级到 npm@11 —— 避免全局 npm@latest 需要 node>=22.22）
          echo "npm version: $(npm --version)"
          if ! npm --version | grep -qE '^(11\.(5\.[1-9]|[6-9]|[0-9]{2})|1[2-9]|2[0-9])'; then
            npm install -g npm@11
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease $VERSION → dist-tag next"
            npm publish --access public --tag next --provenance --loglevel verbose
          else
            echo "stable $VERSION → dist-tag latest"
            npm publish --access public --provenance --loglevel verbose
          fi
