name: pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync root docs into site
        run: |
          # index.html 卡片链到的根目录文档同步进 docs/；
          # ../ 相对链接在 Pages 项目站（/repo-audit/ 前缀）下会上溯出站点致 404，
          # 故 index.html 同步改为 ./ 前缀（见同提交）
          cp AUDIT.md BEST-PRACTICES.md REPO-CLASSIFICATION.md docs/
          mkdir -p docs/templates
          cp templates/README.md docs/templates/README.md
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
